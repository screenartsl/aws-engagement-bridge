  NotifyExecutionRole:
    # Email (SES) and SMS (End User Messaging SMS) only. No WhatsApp, no Bedrock. Separate approval (GrantNotify).
    Type: AWS::IAM::Role
    Condition: GrantNotify
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: muserelay-aws-bridge-stage-notify-runtime
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: bridge-notify-runtime
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: OwnState
            Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            Resource: arn:aws:dynamodb:eu-west-1:365470560685:table/muserelay-aws-bridge-stage-state
          - Sid: OwnSigningSecret
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:eu-west-1:365470560685:secret:muserelay-aws-bridge-stage/signing-outbound-??????
          - Sid: OwnLogs
            Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource: arn:aws:logs:eu-west-1:365470560685:log-group:/aws/lambda/muserelay-aws-bridge-stage-notify:*
          - Sid: SesSendFromAccountIdentities
            Effect: Allow
            Action:
            - ses:SendEmail
            Resource:
            - arn:aws:ses:eu-west-1:365470560685:identity/*
            - arn:aws:ses:eu-west-1:365470560685:configuration-set/*
          - Sid: SmsSendFromAccountOriginations
            Effect: Allow
            Action:
            - sms-voice:SendTextMessage
            Resource:
            - arn:aws:sms-voice:eu-west-1:365470560685:phone-number/*
            - arn:aws:sms-voice:eu-west-1:365470560685:sender-id/*
            - arn:aws:sms-voice:eu-west-1:365470560685:pool/*
            - arn:aws:sms-voice:eu-west-1:365470560685:configuration-set/*
            - arn:aws:sms-voice:eu-west-1:365470560685:opt-out-list/*
          - Sid: NoModelsNoWhatsApp
            Effect: Deny
            Action:
            - bedrock:*
            - social-messaging:*
            Resource: '*'
      Tags:
      - Key: Company
        Value: ScreenArt
      - Key: Project
        Value: MuseRelay
      - Key: Component
        Value: aws-engagement-bridge
      - Key: Environment
        Value: staging
      - Key: Purpose
        Value: hackathon
  NotifyProvisioningPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: GrantNotify
    Properties:
      ManagedPolicyName: muserelay-aws-bridge-stage-notify-provisioning
      Description: Funcion de email/SMS del AWS Engagement Bridge, solo stage en Irlanda
      Roles:
      - Ref: StageCloudFormationRole
      PolicyDocument: {"Version":"2012-10-17","Statement":[{"Sid":"PassOnlyNotifyRuntime","Effect":"Allow","Action":["iam:PassRole"],"Resource":"arn:aws:iam::365470560685:role/muserelay-aws-bridge-stage-notify-runtime","Condition":{"StringEquals":{"iam:PassedToService":"lambda.amazonaws.com"}}},{"Sid":"NotifyFunctionProvisioning","Effect":"Allow","Action":["lambda:CreateFunction","lambda:GetFunction","lambda:GetFunctionConfiguration","lambda:GetFunctionCodeSigningConfig","lambda:GetFunctionConcurrency","lambda:UpdateFunctionCode","lambda:UpdateFunctionConfiguration","lambda:DeleteFunction","lambda:PutFunctionConcurrency","lambda:DeleteFunctionConcurrency","lambda:TagResource","lambda:UntagResource","lambda:ListTags","lambda:GetFunctionRecursionConfig","lambda:GetRuntimeManagementConfig","lambda:GetFunctionScalingConfig","lambda:AddPermission","lambda:RemovePermission","lambda:GetPolicy"],"Resource":"arn:aws:lambda:eu-west-1:365470560685:function:muserelay-aws-bridge-stage-notify","Condition":{"StringEquals":{"aws:RequestedRegion":"eu-west-1"}}},{"Sid":"NotifyLogGroupProvisioning","Effect":"Allow","Action":["logs:CreateLogGroup","logs:DeleteLogGroup","logs:PutRetentionPolicy","logs:DeleteRetentionPolicy","logs:TagResource","logs:UntagResource","logs:ListTagsForResource","logs:GetDataProtectionPolicy"],"Resource":["arn:aws:logs:eu-west-1:365470560685:log-group:/aws/lambda/muserelay-aws-bridge-stage-notify","arn:aws:logs:eu-west-1:365470560685:log-group:/aws/lambda/muserelay-aws-bridge-stage-notify:*"],"Condition":{"StringEquals":{"aws:RequestedRegion":"eu-west-1"}}}]}

Outputs:
  MediaBucketName:
    Value:
      Ref: MediaBucket
  CloudFormationExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - StageCloudFormationRole
      - Arn
  KmsRecoveryRoleArn:
    Value:
      Fn::GetAtt:
      - KmsRecoveryRole
      - Arn
  InboundExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - InboundExecutionRole
      - Arn
  EnqueueExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - EnqueueExecutionRole
      - Arn
  SenderExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - SenderExecutionRole
      - Arn
Parameters:
  GrantNotify:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'false'
    - 'true'
    Description: Separate approval for the email/SMS runtime role
  GrantSocialSend:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'false'
    - 'true'
    Description: Separate approval required; first receipt review must leave false
Conditions:
  GrantNotify:
    Fn::Equals:
    - Ref: GrantNotify
    - 'true'
  GrantSocialSend:
    Fn::Equals:
    - Ref: GrantSocialSend
    - 'true'

