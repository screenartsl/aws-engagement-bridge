[global]
daemonize = no
error_log = /dev/null
[bridge-stage]
user = muserelay-aws-stage
group = muserelay-aws-stage
listen = /run/muserelay-aws-stage/fpm.sock
listen.owner = muserelay-aws-stage
# Confirm the actual Caddy process group in the activation review; do not grant production users access.
listen.group = caddy
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
request_terminate_timeout = 30s
clear_env = yes
env[APP_ENV] = bridge-staging
env[APP_CONFIG_CACHE] = /var/lib/muserelay-aws-stage/cache/config.php
env[APP_SERVICES_CACHE] = /var/lib/muserelay-aws-stage/cache/services.php
env[APP_PACKAGES_CACHE] = /var/lib/muserelay-aws-stage/cache/packages.php
env[APP_ROUTES_CACHE] = /var/lib/muserelay-aws-stage/cache/routes.php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = off
php_admin_value[open_basedir] = /srv/muserelay-aws-stage:/var/lib/muserelay-aws-stage:/run/muserelay-aws-stage:/etc/muserelay/aws-bridge:/etc/ssl/certs:/usr/share/zoneinfo
